name: CI

# Runs on every push to main and on pull requests. This validates changes
# early; the tag-triggered release workflow (release.yml) only publishes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The checks live in package.json scripts so they run identically on a
      # dev machine and in CI (see AGENTS.md). There is nothing to install:
      # the extension has no runtime dependencies (pi bundles its peers).
      - name: Bundle + package content checks
        run: npm run check

      # AGENTS.md: this project is English-only.
      - name: No-German guard
        run: |
          if grep -rInP '[äöüÄÖÜß]' README.md AGENTS.md CHANGELOG.md extensions src package.json; then
            echo '::error::German text found (see AGENTS.md: English only)'
            exit 1
          fi
